
name: CI

on:
  workflow_call:
  push: 
permissions:
  security-events: write
  packages: read
  actions: read
  contents: read
jobs:
  
  Build:
    runs-on: ubuntu-latest
    name: Build
    steps:   
    
      - name: Git Clone
        uses: actions/checkout@v4
      
      - name: Set Up JDK
        uses: actions/setup-java@v4.2.1
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Mvn compile
        run: |
          mvn -q -DskipTests package
      
      - name: Upload Maven artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maven-build
          path: target/
                    
  Docker-build:
    name: Build Docker Image
    needs: 
      - Build
    runs-on: ubuntu-latest
    steps:
      - name: Git Clone
        uses: actions/checkout@v4
        
      - name: Docker Auth
        run: |
          echo "Docker login"

      - name: Docker Config
        uses: docker/setup-buildx-action@v3
      
      - name: Download Maven artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-build
          path: target/
      
      - name: Construccion Imagen
        run: | 
          docker build -t clagosu/ms-catalog-content:latest .
          echo "Docker build"

          
  Docker-push:
    needs: 
      - Docker-build
    runs-on: ubuntu-latest
    steps:
    
      - name: Docker push
        run: |
          echo "Docker push"
  
