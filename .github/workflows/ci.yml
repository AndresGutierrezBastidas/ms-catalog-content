name: CI 
on:
  
  push:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
permissions: write-all
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  SAST:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Runs a single command using the runners shell
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-and-quality
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
  SCA:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mvn package

      - name: Dependency Check
        uses: dependency-check/Dependency-Check_Action@1.1.0
        with:
          exit-code: 1
          project: 'ms-catalog-content'
          path: '.'
          format: 'HTML'
          args: >
            --disableCentral
            
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with: 
          path: ${{github.workspace}}/reports
  
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name : Docker login
        uses: docker/login-action@v4.1.0
        with:
          username: ${{ secrets.USER_DOCKER }}
          password: ${{ secrets.PASS_DOCKER }}
      - name : Docker build
        run: |
          docker build --tag andresbastidasgutierrez/ms-catalog-content-clases:lastes .
      - name : Analisis
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'andresbastidasgutierrez/ms-catalog-content-clases:lastes'
          format: table
          exit-code: 1
          vunl-type: 'os, library'
          severity: 'HIGH,CRITICAL,MEDIUM'
      - name : Docker push
        run: |
          docker push andresbastidasgutierrez/ms-catalog-content-clases:lastes
    
          

      
    
          
